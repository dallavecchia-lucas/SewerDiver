<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>See Diver: The Descent</title>
    <style>
        :root{
            --lcd:#7cffc4;
            --lcd-soft:#bdfde0;
            --lcd-dim:#16261f;
            --cyan:#21f3ff;
            --magenta:#ff2bd6;
            --acid:#9bff4d;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
        html,body{ height:100%; }
        body {
            background:#000; display:flex; justify-content:center; align-items:center;
            min-height:100vh; font-family:'Courier New', Courier, monospace; overflow:hidden;
        }

        /* ═══════ DEVICE FRAME ═══════ */
        #device {
            width:360px; height:720px; background:#0a0a0a;
            border:2px solid #1a1a1a; border-radius:34px;
            position:relative; overflow:hidden;
            box-shadow:0 0 60px rgba(124,255,196,0.05), inset 0 0 30px rgba(0,0,0,0.7);
            padding:10px 10px 24px;
        }
        #brand-plate{
            position:absolute; bottom:5px; left:0; right:0; text-align:center;
            font-size:7px; letter-spacing:3px; color:#222; text-transform:uppercase; z-index:5;
        }
        #screen{ width:100%; height:100%; position:relative; overflow:hidden; background:#000; border-radius:20px; }

        .scanlines{ position:absolute; inset:0; pointer-events:none; z-index:1000;
            background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px); }
        .vignette{ position:absolute; inset:0; pointer-events:none; z-index:998; box-shadow:inset 0 0 60px rgba(0,0,0,0.85); }
        .screen-flicker{ position:absolute; inset:0; pointer-events:none; z-index:999; opacity:0; }
        @keyframes flickerPulse{
            0%{ background:rgba(124,255,196,0.06); opacity:1 }
            40%{ background:rgba(0,0,0,0.85); opacity:0.9 }
            70%{ background:rgba(124,255,196,0.03); opacity:0.5 }
            100%{ background:transparent; opacity:0 }
        }

        .view{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:26px; }
        .view.active{ display:flex; }

        /* ═══════ LCD TEXT COMPONENT ═══════ */
        .lcd-text{
            position:relative; font-family:'Courier New',monospace; font-weight:700;
            text-transform:uppercase; color:var(--lcd); white-space:pre;
            text-shadow:0 0 6px rgba(124,255,196,0.65), 0 0 14px rgba(124,255,196,0.3);
        }
        .lcd-text::before{
            content:attr(data-ghost); position:absolute; left:0; top:0;
            color:var(--lcd-dim); text-shadow:none; z-index:-1;
        }
        .lcd-ch{ display:inline-block; opacity:0; animation:lcdOn 0.1s steps(1) forwards; }
        @keyframes lcdOn{ to{ opacity:1 } }

        /* ═══════ POWER ON ═══════ */
        .pwr-dot{
            width:6px; height:6px; border-radius:50%; background:var(--lcd);
            box-shadow:0 0 10px var(--lcd); animation:pwrBlink 0.5s steps(1) infinite;
        }
        @keyframes pwrBlink{ 50%{ opacity:0 } }

        /* ═══════ LOGO 1 — BIOCRAFTED STUDIOS ═══════ */
        #logo1{ gap:8px; cursor:pointer; }
        .dna-wrap{ width:150px; height:172px; }
        .dna-line{ fill:none; stroke:var(--lcd); stroke-width:3; stroke-linecap:round;
            filter:url(#dnaGlow); stroke-dasharray:1000; stroke-dashoffset:1000; animation:dnaDraw 1s ease forwards; }
        .dna-rung{ stroke-width:2; }
        .dna-wave{ stroke-width:2; }
        .dna-leaf{ fill:var(--lcd); filter:url(#dnaGlow); opacity:0; animation:leafFade 0.6s ease forwards; }
        @keyframes dnaDraw{ to{ stroke-dashoffset:0 } }
        @keyframes leafFade{ to{ opacity:0.9 } }
        .logo1-name{ font-size:20px; letter-spacing:10px; margin-top:4px; }
        .logo1-sub{ font-size:11px; letter-spacing:7px; color:var(--lcd-soft); opacity:0.75; margin-top:6px; }
        .tap-hint{ position:absolute; bottom:22px; font-size:7px; letter-spacing:2px; color:#2a3a32; animation:hintBlink 1.6s infinite; }
        @keyframes hintBlink{ 50%{ opacity:0.15 } }

        /* ═══════ LOGO 2 — PRESENTS ═══════ */
        #logo2{ cursor:pointer; }
        .presents{ font-size:14px; letter-spacing:6px; }

        /* ═══════ TITLE — SEE DIVER: THE DESCENT ═══════ */
        #title-view{ cursor:pointer; gap:6px; }
        .cyber-title{
            position:relative; font-size:32px; letter-spacing:3px; font-weight:700; color:#fff;
        }
        .cyber-title::before, .cyber-title::after{
            content:attr(data-text); position:absolute; left:0; top:0; width:100%;
        }
        .cyber-title::before{
            color:var(--cyan); clip-path:inset(0 0 55% 0); -webkit-clip-path:inset(0 0 55% 0);
            transform:translate(-2px,-1px); animation:glA 2.6s infinite linear;
        }
        .cyber-title::after{
            color:var(--magenta); clip-path:inset(55% 0 0 0); -webkit-clip-path:inset(55% 0 0 0);
            transform:translate(2px,1px); animation:glB 2.6s infinite linear;
        }
        @keyframes glA{
            0%,100%{ clip-path:inset(0 0 55% 0) } 45%{ clip-path:inset(10% 0 70% 0) }
            50%{ clip-path:inset(70% 0 5% 0) } 55%{ clip-path:inset(0 0 55% 0) }
        }
        @keyframes glB{
            0%,100%{ clip-path:inset(55% 0 0 0) } 45%{ clip-path:inset(80% 0 0 0) }
            50%{ clip-path:inset(5% 0 60% 0) } 55%{ clip-path:inset(55% 0 0 0) }
        }
        .cyber-rule{ width:140px; height:1px; margin:16px 0; background:linear-gradient(90deg,transparent,var(--magenta),var(--cyan),transparent); }
        .cyber-sub{ font-size:13px; letter-spacing:9px; color:var(--cyan); text-shadow:0 0 8px var(--cyan); }
        .cyber-tagline{ position:absolute; bottom:22px; font-size:7px; letter-spacing:2px; color:#335; animation:hintBlink 1.6s infinite; }

        /* ═══════ FIRST TIME? ═══════ */
        #firsttime{ gap:18px; }
        .portrait-frame{ width:180px; height:180px; }
        .lens{ fill:var(--acid); filter:url(#mglow); }
        .ear-glow{ fill:#1a0a14; stroke:var(--magenta); stroke-width:1.2; }
        .ear-wire{ stroke:var(--magenta); stroke-width:1.2; }
        .dialogue-box{
            width:100%; border:1px solid #1a2a20; border-radius:6px; padding:14px;
            background:rgba(0,20,10,0.4);
        }
        .dq-text{ font-size:13px; letter-spacing:2px; color:var(--lcd); margin-bottom:12px; text-transform:uppercase; }
        .ft-btns{ display:flex; gap:10px; justify-content:center; }
        .lcd-btn{
            padding:10px 26px; border:1px solid #1a2a20; border-radius:4px;
            color:var(--lcd); font-size:10px; letter-spacing:2px; text-transform:uppercase;
            font-family:'Courier New',monospace; cursor:pointer; background:rgba(124,255,196,0.04);
            transition:background 0.15s;
        }
        .lcd-btn:active{ background:rgba(124,255,196,0.18); }
        .lcd-btn.alt{ color:#7a8a99; border-color:#1a1a2a; }

        /* ═══════ TUTORIAL ═══════ */
        #tutorial{ justify-content:space-between; }
        .tut-skip{
            position:absolute; top:18px; right:18px; font-size:8px; letter-spacing:1.5px;
            color:#5a7a8a; cursor:pointer; text-transform:uppercase; border-bottom:1px dotted #335;
        }
        .tut-card{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
        .tut-step-label{ font-size:8px; letter-spacing:3px; color:#446; }
        .tut-step-text{ font-size:13px; line-height:1.8; color:var(--lcd-soft); max-width:240px; }
        .tut-dots{ display:flex; gap:6px; justify-content:center; margin:16px 0; }
        .tut-dot{ width:5px; height:5px; border-radius:50%; background:#1a2a20; }
        .tut-dot.on{ background:var(--lcd); box-shadow:0 0 5px var(--lcd); }

        /* ═══════ CRT STATIC TRANSITION ═══════ */
        #crt-view{ background:#000; padding:0; }
        #crt-canvas{ width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; opacity:0.85; }
        #crt-view.crt-fade #crt-canvas{ transition:opacity 0.4s; opacity:0; }
        .crt-sync{ position:absolute; left:0; right:0; height:14px; top:-14px; background:rgba(255,255,255,0.08); animation:syncRoll 1.1s linear infinite; }
        @keyframes syncRoll{ 0%{ top:-14px } 100%{ top:100% } }
        .crt-flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
        .crt-flash.on{ animation:crtFlash 0.15s ease-out; }
        @keyframes crtFlash{ 0%{ opacity:0.9 } 100%{ opacity:0 } }

        /* ═══════ GAME ═══════ */
        #game-view{ gap:4px; }
        .gv-header{ font-size:9px; letter-spacing:4px; color:var(--cyan); margin-bottom:20px; }
        .gv-depth-label{ font-size:8px; letter-spacing:3px; color:#456; margin-bottom:4px; }
        .gv-depth{ font-size:36px; color:var(--acid); text-shadow:0 0 10px var(--acid); }
        .gv-depth small{ font-size:16px; }
        .gv-status{ font-size:10px; letter-spacing:2px; color:var(--lcd-soft); margin-top:24px; }
        .gv-cursor{ display:inline-block; width:7px; height:11px; background:var(--lcd); margin-left:2px; vertical-align:middle; animation:blink 0.9s step-end infinite; }
        @keyframes blink{ 50%{ opacity:0 } }

        @media (max-width:400px) { #device{ width:100vw; height:100vh; border-radius:0; border:none; } }
    </style>
</head>
<body>
<div id="device">
<div id="screen">
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="screen-flicker" id="flicker"></div>

    <!-- ═══════ POWER ON ═══════ -->
    <div class="view active" id="power-on"><div class="pwr-dot"></div></div>

    <!-- ═══════ LOGO 1 — BIOCRAFTED STUDIOS ═══════ -->
    <div class="view" id="logo1">
        <svg class="dna-wrap" viewBox="0 0 140 172" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="dnaGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="1.6" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            <path class="dna-line" style="animation-delay:.05s" d="M70,14 C40,30 100,46 70,62 C40,78 100,94 70,110 C40,126 100,142 70,150"/>
            <path class="dna-line" style="animation-delay:.25s" d="M70,14 C100,30 40,46 70,62 C100,78 40,94 70,110 C100,126 40,142 70,150"/>
            <line class="dna-line dna-rung" style="animation-delay:.55s" x1="46" y1="38" x2="94" y2="38"/>
            <line class="dna-line dna-rung" style="animation-delay:.65s" x1="46" y1="86" x2="94" y2="86"/>
            <line class="dna-line dna-rung" style="animation-delay:.75s" x1="46" y1="134" x2="94" y2="134"/>
            <path class="dna-leaf" style="animation-delay:.9s" d="M70,14 Q54,-4 42,4 Q52,16 70,14 Z"/>
            <path class="dna-leaf" style="animation-delay:1s" d="M70,14 Q86,-4 98,4 Q88,16 70,14 Z"/>
            <path class="dna-line dna-wave" style="animation-delay:1.1s" d="M8,158 Q22,150 36,158 T64,158 T92,158 T120,158 T134,158"/>
            <path class="dna-line dna-wave" style="animation-delay:1.25s" d="M8,166 Q22,158 36,166 T64,166 T92,166 T120,166 T134,166" opacity="0.5"/>
        </svg>
        <div class="lcd-text logo1-name" id="logo1-name">Biocrafted</div>
        <div class="lcd-text logo1-sub" id="logo1-sub">Studios</div>
        <div class="tap-hint">tap to continue</div>
    </div>

    <!-- ═══════ LOGO 2 — PRESENTS ═══════ -->
    <div class="view" id="logo2">
        <div class="lcd-text presents" id="logo2-text">presents&hellip;</div>
    </div>

    <!-- ═══════ TITLE ═══════ -->
    <div class="view" id="title-view">
        <div class="cyber-title" data-text="SEE DIVER">SEE DIVER</div>
        <div class="cyber-rule"></div>
        <div class="cyber-sub">THE DESCENT</div>
        <div class="cyber-tagline">tap to continue</div>
    </div>

    <!-- ═══════ FIRST TIME? ═══════ -->
    <div class="view" id="firsttime">
        <svg class="portrait-frame" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="mglow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <radialGradient id="pipeShade" cx="50%" cy="40%" r="65%">
                    <stop offset="0%" stop-color="#0c1612"/>
                    <stop offset="100%" stop-color="#020503"/>
                </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="96" fill="url(#pipeShade)" stroke="#1c2a22" stroke-width="3"/>
            <g fill="#243a30">
                <circle cx="100" cy="8" r="3"/><circle cx="100" cy="192" r="3"/>
                <circle cx="8" cy="100" r="3"/><circle cx="192" cy="100" r="3"/>
                <circle cx="32" cy="32" r="3"/><circle cx="168" cy="32" r="3"/>
                <circle cx="32" cy="168" r="3"/><circle cx="168" cy="168" r="3"/>
            </g>
            <path d="M48,200 C44,150 52,108 78,90 L70,82 L86,80 L82,70 L100,76 L118,70 L114,80 L130,82 L122,90 C148,108 156,150 152,200 Z" fill="#0a120e" stroke="#1c2a22" stroke-width="1.5"/>
            <ellipse class="lens" cx="80" cy="104" rx="13" ry="9"/>
            <ellipse class="lens" cx="120" cy="104" rx="13" ry="9"/>
            <line x1="93" y1="104" x2="107" y2="104" stroke="#0a120e" stroke-width="4"/>
            <rect x="88" y="122" width="24" height="14" rx="4" fill="#10201a" stroke="#243a30" stroke-width="1.5"/>
            <path d="M112,129 Q140,134 142,150" fill="none" stroke="#243a30" stroke-width="2"/>
            <circle cx="143" cy="153" r="5" fill="#10201a" stroke="#243a30" stroke-width="1.5"/>
            <circle class="ear-glow" cx="58" cy="98" r="5"/>
            <line class="ear-wire" x1="58" y1="93" x2="56" y2="78"/>
            <g stroke="#16221c" stroke-width="1" opacity="0.6">
                <line x1="64" y1="140" x2="78" y2="170"/>
                <line x1="128" y1="148" x2="118" y2="178"/>
                <line x1="96" y1="150" x2="92" y2="184"/>
            </g>
        </svg>
        <div class="dialogue-box">
            <div class="dq-text">First time here?</div>
            <div class="ft-btns">
                <div class="lcd-btn" id="ft-yes">Yes</div>
                <div class="lcd-btn alt" id="ft-no">No</div>
            </div>
        </div>
    </div>

    <!-- ═══════ TUTORIAL ═══════ -->
    <div class="view" id="tutorial">
        <div class="tut-skip" id="tut-skip">Skip Tutorial &#9656;</div>
        <div class="tut-card">
            <div class="tut-step-label" id="tut-label">LAMP</div>
            <div class="tut-step-text" id="tut-text"></div>
        </div>
        <div class="tut-dots">
            <div class="tut-dot on"></div><div class="tut-dot"></div><div class="tut-dot"></div>
        </div>
        <div class="lcd-btn" id="tut-next-btn">Next &#9656;</div>
    </div>

    <!-- ═══════ CRT STATIC TRANSITION ═══════ -->
    <div class="view" id="crt-view">
        <canvas id="crt-canvas"></canvas>
        <div class="crt-sync"></div>
        <div class="crt-flash" id="crt-flash"></div>
    </div>

    <!-- ═══════ GAME ═══════ -->
    <div class="view" id="game-view">
        <div class="gv-header">SEE DIVER &middot; THE DESCENT</div>
        <div class="gv-depth-label">Depth</div>
        <div class="gv-depth">0.0<small>m</small></div>
        <div class="gv-status">SYSTEMS NOMINAL &mdash; <span id="gv-status-text"></span><span class="gv-cursor"></span></div>
    </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

function show(id){
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    $(id).classList.add('active');
}
function flicker(){
    const f = $('flicker');
    f.style.animation = 'none';
    void f.offsetWidth;
    f.style.animation = 'flickerPulse .25s forwards';
}

// ═════════════════════════════════════════════════════
//  LCD CHARACTER-BY-CHARACTER REVEAL
// ═════════════════════════════════════════════════════
function lcdify(el){
    const text = el.textContent;
    el.setAttribute('data-ghost', text.replace(/[^\s]/g, '8'));
    el.innerHTML = '';
    [...text].forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'lcd-ch';
        span.textContent = ch === ' ' ? ' ' : ch;
        span.style.animationDelay = (i * 35) + 'ms';
        el.appendChild(span);
    });
}

// ═════════════════════════════════════════════════════
//  BOOT SEQUENCE
// ═════════════════════════════════════════════════════
let advanced = false;
function once(fn){ if(advanced) return; advanced = true; fn(); }

function boot(){
    show('power-on');
    setTimeout(() => { flicker(); setTimeout(goLogo1, 500); }, 600);
}

function goLogo1(){
    advanced = false;
    flicker();
    show('logo1');
    lcdify($('logo1-name'));
    lcdify($('logo1-sub'));
    const timer = setTimeout(() => once(goLogo2), 3400);
    $('logo1').onclick = () => { clearTimeout(timer); once(goLogo2); };
}

function goLogo2(){
    advanced = false;
    flicker();
    show('logo2');
    lcdify($('logo2-text'));
    const timer = setTimeout(() => once(goTitle), 2200);
    $('logo2').onclick = () => { clearTimeout(timer); once(goTitle); };
}

function goTitle(){
    advanced = false;
    flicker();
    show('title-view');
    const timer = setTimeout(() => once(goFirstTime), 3600);
    $('title-view').onclick = () => { clearTimeout(timer); once(goFirstTime); };
}

function goFirstTime(){
    flicker();
    show('firsttime');
}

$('ft-yes').addEventListener('click', () => { flicker(); startTutorial(); });
$('ft-no').addEventListener('click', () => { flicker(); playCRT(showGame); });

// ═════════════════════════════════════════════════════
//  TUTORIAL
// ═════════════════════════════════════════════════════
const TUT = [
    { label:'LAMP',   text:'Your lamp is the only light down here. Mind how long it burns.' },
    { label:'DEPTH',  text:'The deeper you go, the less time you have to come back up.' },
    { label:'SIGNAL', text:'Not everything down here is empty. Stay alert.' },
];
let tutIdx = 0;

function startTutorial(){
    tutIdx = 0;
    show('tutorial');
    renderTut();
}
function renderTut(){
    const t = TUT[tutIdx];
    $('tut-label').textContent = t.label;
    $('tut-text').textContent = t.text;
    document.querySelectorAll('.tut-dot').forEach((d,i) => d.classList.toggle('on', i===tutIdx));
    $('tut-next-btn').textContent = tutIdx === TUT.length-1 ? 'Begin Dive' : 'Next ▸';
}
$('tut-next-btn').addEventListener('click', () => {
    flicker();
    if(tutIdx < TUT.length-1){ tutIdx++; renderTut(); }
    else { playCRT(showGame); }
});
$('tut-skip').addEventListener('click', () => { playCRT(showGame); });

// ═════════════════════════════════════════════════════
//  CRT STATIC TRANSITION
// ═════════════════════════════════════════════════════
function playCRT(callback){
    const view = $('crt-view');
    view.classList.remove('crt-fade');
    show('crt-view');
    const flash = $('crt-flash');
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');

    const canvas = $('crt-canvas');
    const ctx = canvas.getContext('2d');
    const w = 64, h = 128;
    canvas.width = w; canvas.height = h;

    let frame = 0;
    const maxFrames = 20;
    const iv = setInterval(() => {
        const img = ctx.createImageData(w, h);
        for(let i=0; i<img.data.length; i+=4){
            const v = Math.random() * 255;
            img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        frame++;
        if(frame >= maxFrames){
            clearInterval(iv);
            view.classList.add('crt-fade');
            setTimeout(callback, 420);
        }
    }, 38);
}

// ═════════════════════════════════════════════════════
//  GAME LANDING
// ═════════════════════════════════════════════════════
function showGame(){
    show('game-view');
    flicker();
    typeStatus();
}
function typeStatus(){
    const el = $('gv-status-text');
    const msg = 'descending...';
    el.textContent = '';
    let i = 0;
    const iv = setInterval(() => {
        el.textContent += msg[i]; i++;
        if(i >= msg.length) clearInterval(iv);
    }, 70);
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
